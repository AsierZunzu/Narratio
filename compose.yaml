services:
  tts:
    image: rhasspy/wyoming-piper
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-en_US-lessac-medium}
    volumes:
      - ./data/piper:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.connect((\"localhost\",10200)); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  narratio:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: ${PORT:-3000}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      RSS_URL: ${RSS_URL}
      POLL_INTERVAL: ${POLL_INTERVAL:-}
      PIPER_HOST: tts
      PIPER_PORT: "10200"
      TTS_TIMEOUT: ${TTS_TIMEOUT:-300}
      TTS_MAX_RETRIES: ${TTS_MAX_RETRIES:-3}
      RSS_FETCH_TIMEOUT: ${RSS_FETCH_TIMEOUT:-30000}
      MAX_AUDIO_FILES: ${MAX_AUDIO_FILES:-}
      FORCE_RESET: ${FORCE_RESET:-}
      UNAVAILABLE_MESSAGE: ${UNAVAILABLE_MESSAGE:-This content is no longer available on the server.}
      TTS_FAILED_MESSAGE: ${TTS_FAILED_MESSAGE:-This podcast episode could not be generated due to a text-to-speech error.}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data/app:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      tts:
        condition: service_healthy
