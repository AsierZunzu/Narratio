services:
  server:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PIPER_URL=http://tts-engine:5000
      - PODCAST_TITLE=RSS to Podcast
      - PODCAST_DESCRIPTION=Automatically generated podcast from RSS feeds
      - PODCAST_AUTHOR=RSS to Podcast Worker
      - PODCAST_LANGUAGE=en
      - PODCAST_ITUNES_CATEGORY=Technology
      - PODCAST_ITUNES_OWNER_EMAIL=worker@example.com
      - UNAVAILABLE_MESSAGE=This content is no longer available on the server.
    depends_on:
      - tts-engine
    command: ["npm", "run", "start:server"]

  worker:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PIPER_URL=http://tts-engine:5000
      - RSS_URL=http://feeds.bbci.co.uk/news/rss.xml
      - MAX_AUDIO_FILES=50
      - MAX_AUDIO_SIZE_MB=500
    depends_on:
      - tts-engine
    # Example usage (can still override via CLI):
    command: ["npm", "run", "start:worker"]

  tts-engine:
    image: rhasspy/piper:latest
#    ports:
#      - "5000:5000"
    command: ["--model", "en_US-lessac-medium"]
    # For natural Spanish voices, use:
    # command: ["--model", "es_ES-sharvard-medium"]
    # For a list of models: https://github.com/rhasspy/piper/releases/tag/v0.0.2
