services:
  server:
    build: .
    container_name: server
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PIPER_URL=http://tts-engine:10200
      - PODCAST_TITLE=RSS to Podcast
      - PODCAST_DESCRIPTION=Automatically generated podcast from RSS feeds
      - PODCAST_AUTHOR=RSS to Podcast Worker
      - PODCAST_LANGUAGE=en
      - PODCAST_ITUNES_CATEGORY=Technology
      - PODCAST_ITUNES_OWNER_EMAIL=worker@example.com
      - UNAVAILABLE_MESSAGE=This content is no longer available on the server.
    depends_on:
      - tts-engine
    command: ["npm", "run", "start:server"]

  worker:
    build: .
    container_name: worker
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PIPER_URL=http://tts-engine:10200
      - RSS_URL=http://feeds.bbci.co.uk/news/rss.xml
      - POLL_INTERVAL=0 * * * *
      - MAX_AUDIO_FILES=50
      - MAX_AUDIO_SIZE_MB=500
    depends_on:
      - tts-engine
    # Example usage (can still override via CLI):
    command: ["npm", "run", "start:worker"]

  tts-engine:
    image: lscr.io/linuxserver/piper:latest
    container_name: piper
#    ports:
#      - 10200:10200
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PIPER_VOICE=en_US-lessac-medium # For natural Spanish voices, use "es_ES-sharvard-medium"
      - LOCAL_ONLY= #optional
      - PIPER_LENGTH=1.0 #optional
      - PIPER_NOISE=0.667 #optional
      - PIPER_NOISEW=0.333 #optional
      - PIPER_SPEAKER=0 #optional
      - NO_STREAMING= #optional
